version: '3.8'

services:
  # ===========================================
  # Nginx 리버스 프록시
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: cotalk-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/upstream.conf:/etc/nginx/upstream.conf:ro
    # depends_on 제거 - blue/green 어느 쪽이든 먼저 뜰 수 있으므로
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3


  # ===========================================
  # 애플리케이션 (Blue)
  # ===========================================
  app-blue:
    image: ghcr.io/${GITHUB_REPO}:latest
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres:5432/cotalk
      - DB_USERNAME=${DB_USERNAME:-cotalk}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # REDIS_PASSWORD 제거 - Redis에 비밀번호가 없으므로 설정하지 않음
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL:-http://localhost:8080}
      - SWAGGER_SERVER_DESCRIPTION=${SWAGGER_SERVER_DESCRIPTION:-Co-Talk API 서버}
      # Mail 설정 (비밀번호 재설정용, 선택)
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      # Firebase 설정 (푸시 알림)
      - FIREBASE_ENABLED=true
      - FIREBASE_CREDENTIALS_PATH=/tmp/firebase-service-account.json
    volumes:
      # Firebase 서비스 계정 키 마운트 (컨테이너 /tmp에 마운트)
      - ${HOME}/firebase-service-account.json:/tmp/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G


  # ===========================================
  # 애플리케이션 (Green)
  # ===========================================
  app-green:
    image: ghcr.io/${GITHUB_REPO}:latest
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres:5432/cotalk
      - DB_USERNAME=${DB_USERNAME:-cotalk}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # REDIS_PASSWORD 제거 - Redis에 비밀번호가 없으므로 설정하지 않음
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL:-http://localhost:8080}
      - SWAGGER_SERVER_DESCRIPTION=${SWAGGER_SERVER_DESCRIPTION:-Co-Talk API 서버}
      # Mail 설정 (비밀번호 재설정용, 선택)
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      # Firebase 설정 (푸시 알림)
      - FIREBASE_ENABLED=true
      - FIREBASE_CREDENTIALS_PATH=/tmp/firebase-service-account.json
    volumes:
      # Firebase 서비스 계정 키 마운트 (컨테이너 /tmp에 마운트)
      - ${HOME}/firebase-service-account.json:/tmp/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

    profiles:
      - green

  # ===========================================
  # 데이터베이스
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: cotalk-postgres
    restart: unless-stopped
    # 외부 포트 노출 없음 - 도커 내부 네트워크에서 postgres:5432로 접근
    environment:
      POSTGRES_DB: cotalk
      POSTGRES_USER: ${DB_USERNAME:-cotalk}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cotalk} -d cotalk"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================
  # 캐시 / 세션 스토어
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: cotalk-redis
    restart: unless-stopped
    # 외부 포트 노출 없음 - 도커 내부 네트워크에서 redis:6379로 접근
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ===========================================
  # 파일 저장소 (S3 호환)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: cotalk-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================
  # 모니터링 - Prometheus
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cotalk-prometheus
    restart: unless-stopped
    # 외부 포트 불필요 - Grafana가 내부 네트워크에서 접근
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 모니터링 - Grafana
  # ===========================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: cotalk-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-13001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cotalk-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 분산 추적 - Zipkin
  # ===========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: cotalk-zipkin
    restart: unless-stopped
    # 외부 포트 불필요 - Grafana/내부에서 접근
    environment:
      - STORAGE_TYPE=mem
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 로그 수집 - Loki
  # ===========================================
  loki:
    image: grafana/loki:2.9.2
    container_name: cotalk-loki
    restart: unless-stopped
    # 외부 포트 불필요 - Grafana가 내부에서 접근
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 알림 - Alertmanager
  # ===========================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: cotalk-alertmanager
    restart: unless-stopped
    # 외부 포트 불필요 - Prometheus가 내부에서 접근
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  cotalk-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
