      - BLIND_INDEX_SECRET=${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET is required}
      # 검색 토큰 백필(1회성 관리 작업). 평시 false, 백필 윈도우에서만 true로 기동 후 되돌림.
      - SEARCH_BACKFILL_ENABLED=${SEARCH_BACKFILL_ENABLED:-false}
      - SEARCH_BACKFILL_CHUNK_SIZE=${SEARCH_BACKFILL_CHUNK_SIZE:-500}
      - SEARCH_BACKFILL_THROTTLE_MILLIS=${SEARCH_BACKFILL_THROTTLE_MILLIS:-0}
      - SEARCH_BACKFILL_SKIP_EXISTING=${SEARCH_BACKFILL_SKIP_EXISTING:-true}
      # 분산락 fail-closed 정책(prod 기본 true). 필요 시에만 재정의.
      - LOCK_FAIL_CLOSED=${LOCK_FAIL_CLOSED:-true}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://cotalk-api.tpsg.co.kr}
      - K6_BYPASS_TOKEN=${K6_BYPASS_TOKEN:-}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL:-https://cotalk-api.tpsg.co.kr}
      - SWAGGER_SERVER_DESCRIPTION=${SWAGGER_SERVER_DESCRIPTION:-Co-Talk API 서버}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Co-Talk}
      - EMAIL_SUPPRESSED_DOMAINS=${EMAIL_SUPPRESSED_DOMAINS:-}
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
