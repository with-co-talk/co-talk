version: '3.8'

services:
  # ===========================================
  # Nginx 리버스 프록시
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: cotalk-nginx
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/upstream.conf:/etc/nginx/upstream.conf:ro
    environment:
      - K6_BYPASS_TOKEN=${K6_BYPASS_TOKEN:-disabled}
    command: /bin/sh -c "envsubst '$$K6_BYPASS_TOKEN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    networks:
      - cotalk-network
      - macmini-shared
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # 애플리케이션 (Instance 1 - Stable)
  # ===========================================
  app-1:
    image: cotalk-app:stable
    container_name: co-talk-app-1
    restart: unless-stopped
    stop_grace_period: 35s
    # 컨테이너 메모리 제한. UseContainerSupport+MaxRAMPercentage=75%가 이 한도 기준으로
    # JVM 힙을 약 1.5G로 잡아, 공유 Docker VM에서 힙이 과도하게 커져 OOM-kill 되는 것을 막는다.
    mem_limit: 2g
    environment:
      - SPRING_PROFILES_ACTIVE=docker,prod
      - DB_URL=jdbc:postgresql://postgres:5432/cotalk
      - DB_USERNAME=${DB_USERNAME:-cotalk}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # MinIO API endpoint — NAS 외부 호스트(자체 운영). docker 서비스명 아님.
      # IP 변경 시 .env의 MINIO_ENDPOINT로 덮어쓸 것.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://192.168.219.104:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-https://cotalk-api.tpsg.co.kr/minio}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # 메시지 검색 블라인드 인덱스(HMAC) 시크릿. 필수(미설정 시 fail-fast로 기동 실패).
      # ENCRYPTION_KEY와 반드시 다른 별도 값(Base64 32바이트).
      - BLIND_INDEX_SECRET=${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET is required}
      # 검색 토큰 백필(1회성 관리 작업). 평시 false, 백필 윈도우에서만 true로 기동 후 되돌림.
      - SEARCH_BACKFILL_ENABLED=${SEARCH_BACKFILL_ENABLED:-false}
      - SEARCH_BACKFILL_CHUNK_SIZE=${SEARCH_BACKFILL_CHUNK_SIZE:-500}
      - SEARCH_BACKFILL_THROTTLE_MILLIS=${SEARCH_BACKFILL_THROTTLE_MILLIS:-0}
      - SEARCH_BACKFILL_SKIP_EXISTING=${SEARCH_BACKFILL_SKIP_EXISTING:-true}
      # 분산락 fail-closed 정책(prod 기본 true). 필요 시에만 재정의.
      - LOCK_FAIL_CLOSED=${LOCK_FAIL_CLOSED:-true}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://cotalk-api.tpsg.co.kr}
      - K6_BYPASS_TOKEN=${K6_BYPASS_TOKEN:-}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL:-https://cotalk-api.tpsg.co.kr}
      - SWAGGER_SERVER_DESCRIPTION=${SWAGGER_SERVER_DESCRIPTION:-Co-Talk API 서버}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Co-Talk}
      - EMAIL_SUPPRESSED_DOMAINS=${EMAIL_SUPPRESSED_DOMAINS:-}
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-${HOME}/firebase-service-account.json}:/tmp/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cotalk-network
      - macmini-shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

