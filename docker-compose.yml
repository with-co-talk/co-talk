  # ===========================================
  # 데이터베이스
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: cotalk-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: cotalk
      POSTGRES_USER: ${DB_USERNAME:-cotalk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cotalk} -d cotalk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # 캐시 / 세션 스토어
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: cotalk-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - cotalk-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # 파일 저장소 (S3 호환) — minio
  # ===========================================
  # minio는 더 이상 이 머신(맥미니)에서 로컬로 띄우지 않는다.
  # NAS(192.168.219.104:9000)에서 외부 운영하며, app은 MINIO_ENDPOINT,
  # nginx는 /minio/ proxy_pass로 NAS 주소를 직접 가리킨다.
  # (과거 로컬 minio 서비스가 nginx의 docker DNS resolve 실패를 유발해
  #  crash-loop → 배포 실패를 일으켰으므로 로컬 서비스를 제거함.)

networks:
  cotalk-network:
    driver: bridge
  macmini-shared:
    external: true

volumes:
  postgres-data:
  redis-data:
