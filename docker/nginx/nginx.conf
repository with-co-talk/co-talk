events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream for 3-instance canary deployment
    # Managed by upstream.conf - includes app-1, app-2, app-3
    include /etc/nginx/upstream.conf;

    # Main server block
    server {
        listen 80;
        server_name _;

        # Max upload size
        client_max_body_size 100M;

        # Disable proxy buffering for real-time streaming
        proxy_buffering off;

        # Nginx health check (for load balancer)
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # WebSocket endpoint (STOMP over WebSocket)
        # /ws와 /ws/ 모두 매치 (Flutter 클라이언트는 /ws로 연결)
        location /ws {
            proxy_pass http://cotalk-backend;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # REST API endpoints
        location / {
            proxy_pass http://cotalk-backend;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
