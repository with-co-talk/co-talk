events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limit bypass: X-K6-Token 헤더가 일치하면 rate limit 미적용
    # k6 부하 테스트 시 사용. 토큰 값 변경 시 이 파일 수정 후 nginx reload.
    map $http_x_k6_token $rate_limit_key {
        default                          $binary_remote_addr;
        "cotalk-k6-bypass-2026"          "";
    }

    # K6 토큰 인증: 헤더(X-K6-Token) 또는 쿼리 파라미터(?k6token=) 확인
    # Prometheus remote write는 쿼리 파라미터로 인증 (k6 모듈이 커스텀 헤더 미지원)
    map $http_x_k6_token $k6_auth_header {
        default                          0;
        "cotalk-k6-bypass-2026"          1;
    }
    map $arg_k6token $k6_auth_param {
        default                          0;
        "cotalk-k6-bypass-2026"          1;
    }

    # Rate limiting zones (bypass 적용)
    limit_req_zone $rate_limit_key zone=api_general:10m rate=30r/s;
    limit_req_zone $rate_limit_key zone=api_auth:10m rate=5r/m;
    limit_req_zone $rate_limit_key zone=ws_connect:10m rate=10r/s;

    # Upstream for 3-instance canary deployment
    # Managed by upstream.conf - includes app-1, app-2, app-3
    include /etc/nginx/upstream.conf;

    # Main server block
    server {
        listen 80;
        server_name _;

        # Hide nginx version
        server_tokens off;

        # Max upload size
        client_max_body_size 100M;

        # Disable proxy buffering for real-time streaming
        proxy_buffering off;

        # Security headers (HSTS and CSP handled by Spring Boot SecurityConfig.java)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Nginx health check (for load balancer)
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Auth endpoints with strict rate limiting
        location /api/v1/auth/login {
            limit_req zone=api_auth burst=3 nodelay;
            proxy_pass http://cotalk-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/signup {
            limit_req zone=api_auth burst=3 nodelay;
            proxy_pass http://cotalk-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint (STOMP over WebSocket)
        # /ws와 /ws/ 모두 매치 (Flutter 클라이언트는 /ws로 연결)
        location /ws {
            limit_req zone=ws_connect burst=5 nodelay;
            proxy_pass http://cotalk-backend;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # Prometheus remote write (k6 메트릭 수집)
        # K6 토큰(헤더 또는 쿼리 파라미터)이 있을 때만 POST 허용
        # 사용법: POST /prometheus/api/v1/write?k6token=<token>
        location /prometheus/api/v1/write {
            # 헤더 또는 쿼리 파라미터 중 하나라도 인증되면 허용
            set $k6_allowed 0;
            if ($k6_auth_header = 1) { set $k6_allowed 1; }
            if ($k6_auth_param = 1)  { set $k6_allowed 1; }
            if ($k6_allowed = 0) {
                return 403;
            }

            # POST만 허용
            limit_except POST {
                deny all;
            }

            # 쿼리 파라미터 제거 후 Prometheus로 전달
            proxy_pass http://prometheus:9090/api/v1/write;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # REST API endpoints (general rate limiting)
        location / {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://cotalk-backend;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
