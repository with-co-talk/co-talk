events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limit bypass: X-K6-Token 헤더가 일치하면 rate limit 미적용
    # k6 부하 테스트 시 사용. K6_BYPASS_TOKEN 환경변수로 토큰 설정.
    # 환경변수가 없으면 빈 문자열이 되어 바이패스 불가.
    map $http_x_k6_token $rate_limit_key {
        default                          $real_client_ip;
        "${K6_BYPASS_TOKEN}"             "";
    }

    # K6 토큰 인증: 헤더(X-K6-Token) 또는 쿼리 파라미터(?k6token=) 확인
    # Prometheus remote write는 쿼리 파라미터로 인증 (k6 모듈이 커스텀 헤더 미지원)
    map $http_x_k6_token $k6_auth_header {
        default                          0;
        "${K6_BYPASS_TOKEN}"             1;
    }
    map $arg_k6token $k6_auth_param {
        default                          0;
        "${K6_BYPASS_TOKEN}"             1;
    }

    # Cloudflare Tunnel forwards the original client IP in CF-Connecting-IP.
    # Fall back to Docker peer address for local/direct traffic.
    map $http_cf_connecting_ip $real_client_ip {
        default                          $http_cf_connecting_ip;
        ""                               $remote_addr;
    }

    # Preserve the public scheme/port from an outer proxy such as Cloudflare.
    map $http_x_forwarded_proto $forwarded_proto {
        default                          $http_x_forwarded_proto;
        ""                               $scheme;
    }
    map $http_x_forwarded_port $forwarded_port {
        default                          $http_x_forwarded_port;
        ""                               $server_port;
    }

    # Rate limiting zones (bypass 적용)
    limit_req_zone $rate_limit_key zone=api_general:10m rate=30r/s;
    limit_req_zone $rate_limit_key zone=api_auth:10m rate=15r/m;
    limit_req_zone $rate_limit_key zone=ws_connect:10m rate=10r/s;
    limit_req_status 429;

    # Upstream for 3 stable instances plus optional canary.
    # Managed by upstream.conf.
    include /etc/nginx/upstream.conf;

    # Main server block
    server {
        # SSL/TLS termination은 Synology 리버스 프록시에서 처리
        # 이 Nginx는 내부 네트워크에서 로드밸런싱 및 보안 헤더 담당
        listen 80;
        server_name _;

        # Hide nginx version
        server_tokens off;

        # Max upload size
        client_max_body_size 100M;

        # Disable proxy buffering for real-time streaming
        proxy_buffering off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Nginx health check (for load balancer)
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Public MinIO object reads.
        # App returns URLs like /minio/{bucket}/{object-key}; bucket policy controls read access.
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth endpoints with strict rate limiting
        location /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://cotalk-backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        location /api/v1/auth/signup {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://cotalk-backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        # WebSocket endpoint (STOMP over WebSocket)
        # /ws와 /ws/ 모두 매치 (Flutter 클라이언트는 /ws로 연결)
        location /ws {
            limit_req zone=ws_connect burst=5 nodelay;
            proxy_pass http://cotalk-backend;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;

            # WebSocket timeout (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # Prometheus remote write (k6 메트릭 수집)
        # K6 토큰(헤더 또는 쿼리 파라미터)이 있을 때만 POST 허용
        # 사용법: POST /prometheus/api/v1/write?k6token=<token>
        location /prometheus/api/v1/write {
            # 헤더 또는 쿼리 파라미터 중 하나라도 인증되면 허용
            set $k6_allowed 0;
            if ($k6_auth_header = 1) { set $k6_allowed 1; }
            if ($k6_auth_param = 1)  { set $k6_allowed 1; }
            if ($k6_allowed = 0) {
                return 403;
            }

            # POST만 허용
            limit_except POST {
                deny all;
            }

            # 쿼리 파라미터 제거 후 Prometheus로 전달
            proxy_pass http://prometheus:9090/api/v1/write;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
        }

        # REST API endpoints (general rate limiting)
        location / {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://cotalk-backend;

            # Upstream keepalive 연결 재사용 (upstream.conf keepalive 16과 연동)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        error_page 429 = @rate_limited_json;

        location @rate_limited_json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 429 '{"code":"RATE_LIMIT_EXCEEDED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}';
        }
    }
}
