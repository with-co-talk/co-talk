global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot 애플리케이션 메트릭 (stable 3-instance)
  - job_name: 'cotalk-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app-1:8080', 'app-2:8080', 'app-3:8080']
        labels:
          instance_type: 'stable'
      - targets: ['app-canary:8080']
        labels:
          instance_type: 'canary'
    relabel_configs:
      - source_labels: [__address__]
        regex: 'app-(.+):8080'
        target_label: instance_id
        replacement: '$1'
