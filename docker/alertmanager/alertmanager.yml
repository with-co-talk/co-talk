# ===========================================
# Co-Talk Alertmanager 설정
# ===========================================
# Alertmanager는 환경변수 치환을 지원하지 않습니다.
# Slack/이메일 알림을 사용하려면 아래 값을 직접 수정하세요.
#
# Slack 설정:
#   각 receiver의 api_url에 Slack Webhook URL 입력
#
# 이메일 설정:
#   global 섹션의 smtp_* 주석 해제 후 값 입력
#   critical-receiver의 email_configs 주석 해제
# ===========================================

global:
  resolve_timeout: 5m
  # SMTP 설정 (Gmail 앱 비밀번호 생성: https://myaccount.google.com/apppasswords)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'sgyjdev@gmail.com'
  smtp_auth_username: 'sgyjdev@gmail.com'
  smtp_auth_password: '__SMTP_AUTH_PASSWORD__'  # docker-compose에서 .env 값으로 자동 치환됨
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      repeat_interval: 30m  # Critical은 30분마다 재전송
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 2h  # Warning은 2시간마다 재전송

receivers:
  # 기본 수신자 (이메일 알림)
  - name: 'default-receiver'
    email_configs:
      - to: 'sgyjdev@gmail.com'
        send_resolved: true
        headers:
          Subject: '[Co-Talk Alert] {{ .GroupLabels.alertname }}'
        html: |
          <h2>[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}</h2>
          {{ range .Alerts }}
          <ul>
            <li><b>Alert:</b> {{ .Labels.alertname }}</li>
            <li><b>Severity:</b> {{ .Labels.severity }}</li>
            <li><b>Description:</b> {{ .Annotations.description }}</li>
            {{ if .Labels.instance }}<li><b>Instance:</b> {{ .Labels.instance }}</li>{{ end }}
          </ul>
          {{ end }}
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#cotalk-alerts'
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Severity:* {{ .Labels.severity }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}

  # Critical 알림 (우선순위 높음, 30분마다 재전송)
  - name: 'critical-receiver'
    email_configs:
      - to: 'sgyjdev@gmail.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] Co-Talk 긴급 알림: {{ .GroupLabels.alertname }}'
          Priority: 'urgent'
        html: |
          <h1 style="color: red;">🚨 [CRITICAL] {{ .GroupLabels.alertname }}</h1>
          {{ range .Alerts }}
          <ul>
            <li><b>Alert:</b> {{ .Labels.alertname }}</li>
            <li><b>Instance:</b> {{ .Labels.instance }}</li>
            <li><b>Severity:</b> {{ .Labels.severity }}</li>
            <li><b>Description:</b> {{ .Annotations.description }}</li>
            <li><b>Summary:</b> {{ .Annotations.summary }}</li>
          </ul>
          {{ end }}
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#cotalk-critical'
    #     send_resolved: true
    #     color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    #     title: ':rotating_light: [CRITICAL] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Instance:* {{ .Labels.instance }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}

  # Warning 알림 (2시간마다 재전송)
  - name: 'warning-receiver'
    email_configs:
      - to: 'sgyjdev@gmail.com'
        send_resolved: true
        headers:
          Subject: '[WARNING] Co-Talk 경고: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: orange;">⚠️ [WARNING] {{ .GroupLabels.alertname }}</h2>
          {{ range .Alerts }}
          <ul>
            <li><b>Alert:</b> {{ .Labels.alertname }}</li>
            <li><b>Severity:</b> {{ .Labels.severity }}</li>
            <li><b>Description:</b> {{ .Annotations.description }}</li>
            {{ if .Labels.instance }}<li><b>Instance:</b> {{ .Labels.instance }}</li>{{ end }}
          </ul>
          {{ end }}
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#cotalk-alerts'
    #     send_resolved: true
    #     color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
    #     title: ':warning: [WARNING] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}

# 알림 억제 규칙
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
