# ===========================================
# Co-Talk Alertmanager 설정
# ===========================================
# Alertmanager는 환경변수 치환을 지원하지 않습니다.
# Slack/이메일 알림을 사용하려면 아래 값을 직접 수정하세요.
#
# Slack 설정:
#   각 receiver의 api_url에 Slack Webhook URL 입력
#
# 이메일 설정:
#   global 섹션의 smtp_* 주석 해제 후 값 입력
#   critical-receiver의 email_configs 주석 해제
# ===========================================

global:
  resolve_timeout: 5m
  # SMTP 설정 (이메일 알림 사용 시 주석 해제 후 직접 값 입력)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alertmanager@cotalk.com'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'
  # smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'

receivers:
  # 기본 수신자 (로그만 - Slack 사용 시 slack_configs 주석 해제)
  - name: 'default-receiver'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#cotalk-alerts'
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Severity:* {{ .Labels.severity }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}

  # Critical 알림
  - name: 'critical-receiver'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#cotalk-critical'
    #     send_resolved: true
    #     color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    #     title: ':rotating_light: [CRITICAL] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Instance:* {{ .Labels.instance }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}
    # email_configs:
    #   - to: 'admin@cotalk.com'
    #     send_resolved: true

  # Warning 알림
  - name: 'warning-receiver'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#cotalk-alerts'
    #     send_resolved: true
    #     color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
    #     title: ':warning: [WARNING] {{ .GroupLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}

# 알림 억제 규칙
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
