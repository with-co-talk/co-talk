version: '3.8'

# ===========================================
# 모니터링 스택 (선택적 실행)
# ===========================================
# 사용법: docker-compose -f docker-compose.nas.yml -f docker-compose.monitoring.yml up -d
#
# 주의: 이 스택은 추가로 약 2GB RAM이 필요합니다.
# NAS 리소스가 충분한 경우에만 사용하세요.

services:
  # ===========================================
  # 모니터링 - Prometheus
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cotalk-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================
  # 모니터링 - Grafana
  # ===========================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: cotalk-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-13001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${NAS_DOMAIN:-localhost}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cotalk-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 분산 추적 - Zipkin
  # ===========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: cotalk-zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-19411}:9411"
    environment:
      - STORAGE_TYPE=mem
      - JAVA_OPTS=-Xms64m -Xmx128m
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 로그 수집 - Loki
  # ===========================================
  loki:
    image: grafana/loki:2.9.2
    container_name: cotalk-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-13100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # 알림 - Alertmanager
  # ===========================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: cotalk-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - cotalk-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  cotalk-network:
    external: true
    name: co-talk_cotalk-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
