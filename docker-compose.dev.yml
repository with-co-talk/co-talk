version: '3.8'

# 개발 환경용 Docker Compose (앱 제외, 인프라만)
# 사용법: docker-compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cotalk-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cotalk
      POSTGRES_USER: cotalk
      POSTGRES_PASSWORD: cotalk
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotalk -d cotalk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cotalk-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cotalk-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-dev-data:/data

volumes:
  postgres-dev-data:
  redis-dev-data:
  minio-dev-data:
