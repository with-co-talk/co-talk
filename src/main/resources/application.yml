spring:
  application:
    name: co-talk-backend

  # 파일 업로드 설정 (Servlet 레벨)
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

  # Jackson 날짜 직렬화 설정 (ISO 8601 형식)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Seoul

  # Virtual Threads 활성화
  threads:
    virtual:
      enabled: true
  
  # Database 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/cotalk
    username: ${DB_USERNAME:cotalk}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        # 대량 INSERT(메시지 검색 토큰 등)를 JDBC batch로 묶어 round-trip 절감
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Flyway 설정 (데이터베이스 마이그레이션)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
  
  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  
  # Cache 설정
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1시간

  # Graceful Shutdown (롤링 배포 시 in-flight 요청 완료 대기)
  lifecycle:
    timeout-per-shutdown-phase: 30s

# 서버 설정
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# JWT 설정
jwt:
  secret: ${JWT_SECRET}  # 필수 환경변수 - 최소 256비트(32자) 이상 필요
  expiration: ${JWT_EXPIRATION:3600000}  # 1시간 (밀리초) - refresh token으로 갱신
  refresh-token:
    expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}  # 30일

# Firebase 설정 (푸시 알림)
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

# MinIO 설정 (파일 저장소)
# 보안: 프로덕션에서는 반드시 환경변수로 자격증명 설정 필요
minio:
  enabled: ${MINIO_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}  # 필수 환경변수 - 기본값 없음
  secret-key: ${MINIO_SECRET_KEY}  # 필수 환경변수 - 기본값 없음
  bucket: ${MINIO_BUCKET:cotalk}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  # 공개 읽기 정책 설정 여부. true이면 버킷에 공개 읽기 정책 적용(인증 없이 접근 가능).
  # false로 설정 시 Pre-signed URL을 통해서만 파일에 접근 가능. (기본값: true - 기존 동작 유지)
  public-read-policy: ${MINIO_PUBLIC_READ_POLICY:true}

# 파일 업로드 설정
file:
  upload:
    max-size: ${FILE_MAX_SIZE:10485760} # 10MB

# 이메일 설정 (SMTP)
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from-address: ${MAIL_FROM_ADDRESS:}
  from-name: ${MAIL_FROM_NAME:Co-Talk}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# 앱 설정
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}
    server-description: ${SWAGGER_SERVER_DESCRIPTION:Co-Talk API 서버}
  oauth:
    # 소셜 로그인 제공자 토큰을 서버에서 검증하기 위한 설정.
    # 구글/애플 id_token의 aud(대상) 검증에 사용한다.
    # 미설정 시 해당 제공자 검증은 fail-closed(거부)되므로, 사용하는 제공자는 반드시 설정해야 한다.
    # 카카오는 access token의 app_id를 access_token_info API로 조회해 우리 앱 토큰인지 검증한다(cross-app 리플레이 방어).
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}   # 구글 OAuth 클라이언트 ID
    apple:
      client-id: ${APPLE_OAUTH_CLIENT_ID:}    # 애플 서비스 ID (Services ID)
    kakao:
      app-id: ${KAKAO_OAUTH_APP_ID:}          # 카카오 애플리케이션 ID (access token app_id 검증용)
  encryption:
    # AES-256 암호화 키 (32바이트, Base64 인코딩)
    # 프로덕션: 반드시 환경변수로 안전한 키 설정 필요
    # 키 생성: openssl rand -base64 32
    key: ${ENCRYPTION_KEY}  # 필수 환경변수 - 기본값 없음 (보안)
    enabled: ${ENCRYPTION_ENABLED:true}
  search:
    # 블라인드 인덱스(HMAC 트라이그램 토큰) 시크릿 (Base64, 32바이트 권장)
    # AES 암호화 키와 완전히 분리된 별도 시크릿. 프로덕션: 반드시 환경변수로 설정 (기본값 없음)
    # 키 생성: openssl rand -base64 32
    blind-index-secret: ${BLIND_INDEX_SECRET}  # 필수 환경변수 - 기본값 없음 (보안)
    # 기존 메시지 검색 토큰 백필(PR2, 1회성 관리 작업). 기본 비활성 — 실수 실행 방지.
    # 운영: 백필 윈도우에서만 SEARCH_BACKFILL_ENABLED=true로 기동, 완료 후 다시 false.
    backfill:
      enabled: ${SEARCH_BACKFILL_ENABLED:false}             # true면 기동 시 1회 백필 실행
      chunk-size: ${SEARCH_BACKFILL_CHUNK_SIZE:500}         # 한 트랜잭션 당 메시지 수
      throttle-millis: ${SEARCH_BACKFILL_THROTTLE_MILLIS:0} # 청크 사이 슬립(부하 제어)
      skip-existing: ${SEARCH_BACKFILL_SKIP_EXISTING:true}  # 이미 토큰이 있는 메시지는 건너뜀
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  lock:
    # 분산락(Redisson)이 비활성(기동 시 Redis 미가용)일 때의 정책.
    # false(전역 기본, 하위호환): NoOp — 락 없이 즉시 실행하되 주기적으로 경고 (동시성 보호 사라짐).
    # true(운영 권장): fail-closed — 락 보호 작업을 예외로 거부해 무방비 실행을 차단.
    # 운영(prod)에서는 application-prod.yml에서 기본값을 true로 옵트인한다.
    # 어느 프로파일에서든 LOCK_FAIL_CLOSED 환경변수로 재정의할 수 있다.
    fail-closed: ${LOCK_FAIL_CLOSED:false}
  redis:
    channel-prefix: ${REDIS_CHANNEL_PREFIX:chat:room:}
  email:
    suppressed-domains: ${EMAIL_SUPPRESSED_DOMAINS:}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION:30}
  terms:
    service-version: "1.0"
    privacy-version: "1.0"
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    k6-bypass-token: ${K6_BYPASS_TOKEN:}
    endpoints:
      # 인증 API - IP별 제한 (무차별 대입 공격 방지)
      - path: "/api/v1/auth/login"
        requests-per-minute: 5
        per-user: false
      - path: "/api/v1/auth/signup"
        requests-per-minute: 3
        per-user: false
      # OAuth 소셜 로그인 - IP별 제한 (무차별 대입 / JWKS·카카오 증폭 방지)
      - path: "/api/v1/auth/oauth/login"
        requests-per-minute: 5
        per-user: false
      # 비밀번호 재설정 - IP별 제한 (이메일 스팸 방지)
      - path: "/api/v1/password/reset-request"
        requests-per-minute: 2
        requests-per-hour: 5
        per-user: false
      # 비밀번호 재설정 코드 요청 - IP별 제한 (코드 발급 스팸 방지)
      - path: "/api/v1/password/reset-request-code"
        requests-per-minute: 2
        requests-per-hour: 5
        per-user: false
      # 인증 코드 검증 - IP별 제한 (브루트포스 방지)
      - path: "/api/v1/password/verify-code"
        requests-per-minute: 5
        per-user: false
      # 코드 기반 비밀번호 재설정 - IP별 제한 (브루트포스 방지)
      - path: "/api/v1/password/reset-with-code"
        requests-per-minute: 5
        per-user: false
      # 파일 업로드 - 사용자별 제한
      - path: "/api/v1/files/upload"
        requests-per-minute: 10
        requests-per-hour: 50
        per-user: true
      # 친구 검색 - 사용자별 제한
      - path: "/api/v1/users/search"
        requests-per-minute: 30
        per-user: true
      # 메시지 전송 - 사용자별 제한 (스팸 방지)
      - path: "/api/v1/chat/messages"
        requests-per-second: 10
        requests-per-minute: 60
        per-user: true
      # 링크 미리보기 - 사용자별 제한 (SSRF 증폭 방지)
      - path: "/api/v1/link-preview"
        requests-per-minute: 20
        per-user: true

# 로깅 설정
# 주의: 프로덕션 환경에서는 application-prod.yml의 설정이 적용됨
logging:
  level:
    root: INFO
    com.cotalk: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    # 보안: 쿼리 파라미터 로깅 비활성화 (민감 정보 노출 방지)
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

# Actuator 설정
# 보안: env, loggers는 민감 정보 노출 가능성이 있어 프로덕션에서 비활성화
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0  # 개발 환경에서는 100% 샘플링
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# 애플리케이션 정보
info:
  app:
    name: Co-Talk Backend
    description: 대화에 집중한 커뮤니케이션 플랫폼 백엔드
    version: 0.0.1-SNAPSHOT
