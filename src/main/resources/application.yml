spring:
  application:
    name: co-talk-backend

  # 파일 업로드 설정 (Servlet 레벨)
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Jackson 날짜 직렬화 설정 (ISO 8601 형식)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Seoul

  # Virtual Threads 활성화
  threads:
    virtual:
      enabled: true
  
  # Database 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/cotalk
    username: ${DB_USERNAME:cotalk}
    password: ${DB_PASSWORD:cotalk}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  
  # Cache 설정
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1시간

# 서버 설정
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# JWT 설정
jwt:
  secret: ${JWT_SECRET}  # 필수 환경변수 - 최소 256비트(32자) 이상 필요
  expiration: ${JWT_EXPIRATION:86400000}  # 1일 (밀리초) - 프로덕션 권장
  refresh-token:
    expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}  # 7일

# Firebase 설정 (푸시 알림)
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

# MinIO 설정 (파일 저장소)
# 보안: 프로덕션에서는 반드시 환경변수로 자격증명 설정 필요
minio:
  enabled: ${MINIO_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:cotalk}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}

# 파일 업로드 설정
file:
  upload:
    max-size: ${FILE_MAX_SIZE:10485760} # 10MB

# 이메일 설정 (SMTP)
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# 앱 설정
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  redis:
    channel-prefix: ${REDIS_CHANNEL_PREFIX:chat:room:}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION:30}
  terms:
    service-version: "1.0"
    privacy-version: "1.0"
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    endpoints:
      # 인증 API - IP별 제한 (무차별 대입 공격 방지)
      - path: "/api/v1/auth/login"
        requests-per-minute: 5
        per-user: false
      - path: "/api/v1/auth/signup"
        requests-per-minute: 3
        per-user: false
      # 비밀번호 재설정 - IP별 제한 (이메일 스팸 방지)
      - path: "/api/v1/password/reset-request"
        requests-per-minute: 2
        requests-per-hour: 5
        per-user: false
      # 파일 업로드 - 사용자별 제한
      - path: "/api/v1/files/upload"
        requests-per-minute: 10
        requests-per-hour: 50
        per-user: true
      # 친구 검색 - 사용자별 제한
      - path: "/api/v1/users/search"
        requests-per-minute: 30
        per-user: true
      # 메시지 전송 - 사용자별 제한 (스팸 방지)
      - path: "/api/v1/chat/messages"
        requests-per-second: 10
        requests-per-minute: 60
        per-user: true

# 로깅 설정
# 주의: 프로덕션 환경에서는 application-prod.yml의 설정이 적용됨
logging:
  level:
    root: INFO
    com.cotalk: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    # 보안: 쿼리 파라미터 로깅 비활성화 (민감 정보 노출 방지)
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,caches
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0  # 개발 환경에서는 100% 샘플링
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# 애플리케이션 정보
info:
  app:
    name: Co-Talk Backend
    description: 대화에 집중한 커뮤니케이션 플랫폼 백엔드
    version: 0.0.1-SNAPSHOT
