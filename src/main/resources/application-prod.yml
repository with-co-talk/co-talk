# 프로덕션 환경 설정
# 보안과 성능 최적화에 중점

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

  # Flyway - 프로덕션에서 의도치 않은 베이스라이닝 방지
  flyway:
    baseline-on-migrate: false

# 서버 설정 - 보안 강화
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Swagger UI 비활성화 (프로덕션)
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 로깅 - 프로덕션 레벨 (최소화)
logging:
  level:
    root: WARN
    com.cotalk: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

# 암호화 강제 활성화 (프로덕션)
app:
  encryption:
    enabled: true
  # 분산락 fail-closed 운영 옵트인.
  # 본 PR의 defense-in-depth(임계영역 무방비 실행 차단)가 운영에서 실제로 켜지도록
  # prod 프로파일 기본값을 true로 둔다. 전역 기본값(application.yml)은 하위호환을 위해 false.
  # 필요 시 LOCK_FAIL_CLOSED 환경변수로 재정의 가능.
  lock:
    fail-closed: ${LOCK_FAIL_CLOSED:true}

# 모니터링 설정 - 샘플링 조정
management:
  tracing:
    sampling:
      probability: 0.1  # 프로덕션에서는 10% 샘플링
