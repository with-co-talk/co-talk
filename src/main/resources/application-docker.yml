# Docker Compose 환경 설정
# 기본 설정(application.yml)을 상속받고, Docker 환경에 맞게 오버라이드

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/cotalk}
    username: ${DB_USERNAME:cotalk}
    password: ${DB_PASSWORD:cotalk}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# MinIO 설정
minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}

# 분산 추적
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

# 로깅 - 프로덕션 레벨
logging:
  level:
    root: INFO
    com.cotalk: INFO
    org.hibernate.SQL: WARN
