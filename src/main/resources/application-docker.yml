spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/cotalk}
    username: ${DB_USERNAME:cotalk}
    password: ${DB_PASSWORD:cotalk}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# MinIO 설정
minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}

# 분산 추적
management:
  tracing:
    sampling:
      probability: 0.1  # 프로덕션에서는 10% 샘플링
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

# 로깅
logging:
  level:
    root: INFO
    com.cotalk: INFO
    org.hibernate.SQL: WARN
