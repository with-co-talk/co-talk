spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false  # 테스트에서는 ddl-auto: create-drop 사용
  h2:
    console:
      enabled: false
  cache:
    type: none
  data:
    redis:
      enabled: false
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

jwt:
  secret: test-secret-key-for-testing-purposes-only-1234567890
  expiration: 3600000

firebase:
  enabled: false

minio:
  enabled: false

# Snowflake ID 생성기 설정 (Redis 미사용)
snowflake:
  use-redis-allocation: false
  datacenter-id: 0
  worker-id: 0

app:
  rate-limit:
    enabled: false
  encryption:
    key: dGhpc2lzYXRlc3RrZXlmb3JkZXZlbG9wbWVudG9ubHk=
    enabled: false  # 테스트에서는 암호화 비활성화 (검색 테스트 등)
