spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false  # 테스트에서는 ddl-auto: create-drop 사용
  h2:
    console:
      enabled: false
  cache:
    type: simple
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

jwt:
  secret: test-secret-key-for-testing-purposes-only-1234567890
  expiration: 3600000

firebase:
  enabled: false

minio:
  enabled: false

snowflake:
  use-redis-allocation: false
  datacenter-id: 0
  worker-id: 0

app:
  security:
    default-chain:
      enabled: false
  rate-limit:
    enabled: true
    endpoints:
      - path: "/api/v1/users"
        requests-per-minute: 5
        per-user: false
      - path: "/api/v1/reports"
        requests-per-minute: 3
        per-user: true
      - path: "/api/v1/chat"
        requests-per-minute: 100
        per-user: false
  encryption:
    key: dGhpc2lzYXRlc3RrZXlmb3JkZXZlbG9wbWVudG9ubHk=
    enabled: false
