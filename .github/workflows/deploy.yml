name: Deploy to Mac Mini (Canary)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, rollback]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 빌드 서버: 이미지를 만들어 GHCR에 올린다. 여기서만 소스 코드를 만진다.
  build:
    runs-on: self-hosted
    if: github.event.inputs.action != 'rollback'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        run: echo "ref=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        run: |
          # docker login을 쓰지 않는다. Docker Desktop CLI는 로그인 시 config.json에
          # credsStore=osxkeychain을 다시 써넣는데, launchd 러너는 login keychain에
          # 접근할 수 없어 이후 pull/push가 전부 실패한다. 그래서 잡 전용
          # DOCKER_CONFIG에 auths를 직접 기록한다(prepare_build_docker_config와 같은 이유).
          # buildx 등 CLI 플러그인은 링크로 유지한다.
          # runner 컨텍스트는 잡 레벨 env에서 쓸 수 없다. RUNNER_TEMP는 스텝
          # 셸의 기본 환경변수라 여기서 잡고 GITHUB_ENV로 이후 스텝에 넘긴다.
          DOCKER_CONFIG="${RUNNER_TEMP}/docker-ghcr"
          mkdir -p "$DOCKER_CONFIG"
          ln -sfn "${HOME}/.docker/cli-plugins" "${DOCKER_CONFIG}/cli-plugins"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')" \
            > "${DOCKER_CONFIG}/config.json"
          chmod 600 "${DOCKER_CONFIG}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder
          docker buildx build --push -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .

  # 배포 서버: 소스를 빌드하지 않고 GHCR에서 이미지를 받아 띄운다.
  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event.inputs.action != 'rollback'
    env:
      COTALK_IMAGE: ${{ needs.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GHCR
        run: |
          # docker login을 쓰지 않는다. Docker Desktop CLI는 로그인 시 config.json에
          # credsStore=osxkeychain을 다시 써넣는데, launchd 러너는 login keychain에
          # 접근할 수 없어 이후 pull/push가 전부 실패한다. 그래서 잡 전용
          # DOCKER_CONFIG에 auths를 직접 기록한다(prepare_build_docker_config와 같은 이유).
          # buildx 등 CLI 플러그인은 링크로 유지한다.
          # runner 컨텍스트는 잡 레벨 env에서 쓸 수 없다. RUNNER_TEMP는 스텝
          # 셸의 기본 환경변수라 여기서 잡고 GITHUB_ENV로 이후 스텝에 넘긴다.
          DOCKER_CONFIG="${RUNNER_TEMP}/docker-ghcr"
          mkdir -p "$DOCKER_CONFIG"
          ln -sfn "${HOME}/.docker/cli-plugins" "${DOCKER_CONFIG}/cli-plugins"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')" \
            > "${DOCKER_CONFIG}/config.json"
          chmod 600 "${DOCKER_CONFIG}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
          MINIO_ENDPOINT=${{ vars.MINIO_ENDPOINT || 'http://192.168.219.104:9000' }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          BLIND_INDEX_SECRET=${{ secrets.BLIND_INDEX_SECRET }}
          K6_BYPASS_TOKEN=${{ secrets.K6_BYPASS_TOKEN }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          EMAIL_SUPPRESSED_DOMAINS=${{ secrets.EMAIL_SUPPRESSED_DOMAINS }}
          FIREBASE_ENABLED=${{ secrets.FIREBASE_ENABLED }}
          FIREBASE_CREDENTIALS_PATH=/tmp/firebase-service-account.json
          APP_PORT=8081
          EOF

      - name: Ensure Firebase credentials on host
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          CRED_FILE="${HOME}/firebase-service-account.json"
          if [ -n "${FIREBASE_JSON}" ]; then
            printf '%s' "${FIREBASE_JSON}" > "${CRED_FILE}"
            chmod 600 "${CRED_FILE}"
            echo "Wrote Firebase credentials from GitHub secret."
          elif [ -f "${CRED_FILE}" ]; then
            echo "Using existing host credentials at ${CRED_FILE}"
          else
            echo "No FIREBASE_SERVICE_ACCOUNT_JSON secret and no host file at ${CRED_FILE}."
            echo "deploy.sh will fail if FIREBASE_ENABLED=true."
          fi

      - name: Bootstrap (first-time only)
        run: |
          if ! docker image inspect cotalk-app:stable &>/dev/null; then
            echo "No stable image found. Running bootstrap..."
            ./scripts/deploy.sh --init
          else
            echo "Stable image exists. Skipping bootstrap."
          fi

      - name: Canary Deploy
        run: ./scripts/deploy.sh --canary

      - name: Observe canary (2 min)
        run: |
          echo "Observing canary for 120 seconds..."
          sleep 120

      - name: Check canary health
        run: |
          response=$(curl -sf http://localhost:8081/actuator/health/liveness)
          status=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "UNKNOWN")
          if [ "$status" != "UP" ]; then
            echo "Canary health check failed: $status"
            exit 1
          fi
          echo "Canary is healthy: $status"

      - name: Promote canary to stable
        run: ./scripts/deploy.sh --promote

      - name: Print canary logs on failure
        if: failure()
        run: docker logs co-talk-app-canary 2>&1 | tail -50 || true

      - name: Rollback on failure
        if: failure()
        run: ./scripts/deploy.sh --rollback

  rollback:
    runs-on: self-hosted
    if: github.event.inputs.action == 'rollback'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
          MINIO_ENDPOINT=${{ vars.MINIO_ENDPOINT || 'http://192.168.219.104:9000' }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          BLIND_INDEX_SECRET=${{ secrets.BLIND_INDEX_SECRET }}
          K6_BYPASS_TOKEN=${{ secrets.K6_BYPASS_TOKEN }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          EMAIL_SUPPRESSED_DOMAINS=${{ secrets.EMAIL_SUPPRESSED_DOMAINS }}
          FIREBASE_ENABLED=${{ secrets.FIREBASE_ENABLED }}
          FIREBASE_CREDENTIALS_PATH=/tmp/firebase-service-account.json
          APP_PORT=8081
          EOF

      - name: Rollback
        run: ./scripts/deploy.sh --rollback
