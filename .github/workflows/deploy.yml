name: Build, Push and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:  # 수동 실행 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # 1단계: 테스트 + 이미지 빌드 + 푸시
  # ===========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 캐시 + 레지스트리 캐시(보조)로 빌드 시간 단축
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ===========================================
  # 2단계: Tailscale VPN으로 NAS에 무중단 배포
  # ===========================================
  # 공개 포트 없이 Tailscale VPN 터널을 통해 SSH 접속.
  # 필요 secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET,
  #              NAS_SSH_KEY, NAS_USER, NAS_DEPLOY_PATH,
  #              GHCR_USER, GHCR_TOKEN
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to NAS via Tailscale SSH
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # SSH 키 설정
          mkdir -p ~/.ssh
          echo "$NAS_SSH_KEY" > ~/.ssh/nas_key
          echo "" >> ~/.ssh/nas_key
          chmod 600 ~/.ssh/nas_key

          # NAS Tailscale IP 확인 (MagicDNS 또는 직접 IP)
          NAS_IP=$(tailscale status --json | jq -r '.Peer[] | select(.Tags != null) | select(.Tags[] == "tag:nas") | .TailscaleIPs[0]')
          if [ -z "$NAS_IP" ]; then
            echo "::error::NAS not found in Tailscale network (tag:nas)"
            exit 1
          fi
          echo "NAS Tailscale IP: $NAS_IP"

          # SSH로 배포 스크립트 실행
          ssh -i ~/.ssh/nas_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              "$NAS_USER@$NAS_IP" \
              "set -e
               export PATH=\"/usr/bin:/usr/local/bin:\$PATH\"
               [ -f \"\$HOME/.profile\" ] && . \"\$HOME/.profile\" || true
               [ -f \"/etc/profile\" ] && . \"/etc/profile\" || true

               mkdir -p $NAS_DEPLOY_PATH
               cd $NAS_DEPLOY_PATH

               if [ ! -d .git ]; then
                 echo 'Repository not found. Cloning...'
                 git clone https://${GHCR_USER}:${GHCR_TOKEN}@github.com/${GITHUB_REPO}.git .
               else
                 git pull --ff-only
               fi

               for c in co-talk-app-green-1 cotalk-app cotalk-watchtower; do
                 docker rm -f \"\$c\" 2>/dev/null || true
               done

               echo ${GHCR_TOKEN} | docker login ghcr.io -u ${GHCR_USER} --password-stdin

               ./scripts/deploy.sh -f docker-compose.nas.yml --pull"
