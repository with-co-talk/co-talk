name: Deploy to Mac Mini (Canary)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, rollback]

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event.inputs.action != 'rollback'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          K6_BYPASS_TOKEN=${{ secrets.K6_BYPASS_TOKEN }}
          EOF

      - name: Canary Deploy
        run: ./scripts/deploy.sh --canary

      - name: Observe canary (2 min)
        run: |
          echo "Observing canary for 120 seconds..."
          sleep 120

      - name: Check canary health
        run: |
          response=$(curl -sf http://localhost:8080/actuator/health)
          status=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "UNKNOWN")
          if [ "$status" != "UP" ]; then
            echo "Canary health check failed: $status"
            exit 1
          fi
          echo "Canary is healthy: $status"

      - name: Promote canary to stable
        run: ./scripts/deploy.sh --promote

      - name: Print canary logs on failure
        if: failure()
        run: docker logs co-talk-app-canary 2>&1 | tail -50 || true

      - name: Rollback on failure
        if: failure()
        run: ./scripts/deploy.sh --rollback

  rollback:
    runs-on: self-hosted
    if: github.event.inputs.action == 'rollback'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          K6_BYPASS_TOKEN=${{ secrets.K6_BYPASS_TOKEN }}
          EOF

      - name: Rollback
        run: ./scripts/deploy.sh --rollback
