name: Build, Push and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:  # 수동 실행 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # 1단계: 테스트 + 이미지 빌드 + 푸시
  # ===========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 캐시 + 레지스트리 캐시(보조)로 빌드 시간 단축
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ===========================================
  # 2단계: NAS에 무중단 배포
  # ===========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to NAS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_SSH_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            # NAS에서 Docker PATH 로드 (비로그인 셸이면 PATH에 없을 수 있음)
            export PATH="/usr/bin:/usr/local/bin:$PATH"
            [ -f "$HOME/.profile" ] && . "$HOME/.profile" || true
            [ -f "/etc/profile" ] && . "/etc/profile" || true

            # 배포 디렉토리 확보 (없으면 생성)
            mkdir -p ${{ secrets.NAS_DEPLOY_PATH }}
            cd ${{ secrets.NAS_DEPLOY_PATH }}

            # 저장소가 없으면 자동 clone, 있으면 pull
            if [ ! -d .git ]; then
              echo "Repository not found. Cloning..."
              git clone https://${{ secrets.GHCR_USER }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git pull --ff-only
            fi

            # GHCR 로그인 (이미지 풀을 위해)
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            # Blue-Green 무중단 배포 실행
            ./scripts/deploy.sh -f docker-compose.nas.yml --pull
