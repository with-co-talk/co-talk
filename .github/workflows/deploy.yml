name: Deploy to Mac Mini (Canary)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, rollback]

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event.inputs.action != 'rollback'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          K6_BYPASS_TOKEN=${{ secrets.K6_BYPASS_TOKEN }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          EMAIL_SUPPRESSED_DOMAINS=${{ secrets.EMAIL_SUPPRESSED_DOMAINS }}
          FIREBASE_ENABLED=${{ secrets.FIREBASE_ENABLED }}
          FIREBASE_CREDENTIALS_PATH=/tmp/firebase-service-account.json
          APP_PORT=8081
          EOF

      - name: Ensure Firebase credentials on host
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          CRED_FILE="${HOME}/firebase-service-account.json"
          if [ -n "${FIREBASE_JSON}" ]; then
            printf '%s' "${FIREBASE_JSON}" > "${CRED_FILE}"
            chmod 600 "${CRED_FILE}"
            echo "Wrote Firebase credentials from GitHub secret."
          elif [ -f "${CRED_FILE}" ]; then
            echo "Using existing host credentials at ${CRED_FILE}"
          else
            echo "No FIREBASE_SERVICE_ACCOUNT_JSON secret and no host file at ${CRED_FILE}."
            echo "deploy.sh will fail if FIREBASE_ENABLED=true."
          fi

      - name: Bootstrap (first-time only)
        run: |
          if ! docker image inspect cotalk-app:stable &>/dev/null; then
            echo "No stable image found. Running bootstrap..."
            ./scripts/deploy.sh --init
          else
            echo "Stable image exists. Skipping bootstrap."
          fi

      - name: Canary Deploy
        run: ./scripts/deploy.sh --canary

      - name: Observe canary (2 min)
        run: |
          echo "Observing canary for 120 seconds..."
          sleep 120

      - name: Check canary health
        run: |
          response=$(curl -sf http://localhost:8081/actuator/health/liveness)
          status=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "UNKNOWN")
          if [ "$status" != "UP" ]; then
            echo "Canary health check failed: $status"
            exit 1
          fi
          echo "Canary is healthy: $status"

      - name: Promote canary to stable
        run: ./scripts/deploy.sh --promote

      - name: Print canary logs on failure
        if: failure()
        run: docker logs co-talk-app-canary 2>&1 | tail -50 || true

      - name: Rollback on failure
        if: failure()
        run: ./scripts/deploy.sh --rollback

  rollback:
    runs-on: self-hosted
    if: github.event.inputs.action == 'rollback'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          K6_BYPASS_TOKEN=${{ secrets.K6_BYPASS_TOKEN }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          EMAIL_SUPPRESSED_DOMAINS=${{ secrets.EMAIL_SUPPRESSED_DOMAINS }}
          FIREBASE_ENABLED=${{ secrets.FIREBASE_ENABLED }}
          FIREBASE_CREDENTIALS_PATH=/tmp/firebase-service-account.json
          APP_PORT=8081
          EOF

      - name: Rollback
        run: ./scripts/deploy.sh --rollback
