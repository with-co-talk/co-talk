apiVersion: v1
kind: Service
metadata:
  name: cotalk-service
  namespace: cotalk
  labels:
    app.kubernetes.io/name: cotalk
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cotalk
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: cotalk-service-headless
  namespace: cotalk
  labels:
    app.kubernetes.io/name: cotalk
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cotalk
    app.kubernetes.io/component: backend
