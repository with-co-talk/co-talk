apiVersion: v1
kind: Secret
metadata:
  name: cotalk-secret
  namespace: cotalk
  labels:
    app.kubernetes.io/name: cotalk
  annotations:
    # 경고: 이 파일은 예시 템플릿입니다.
    # 프로덕션 환경에서는 절대 이 파일을 그대로 사용하지 마세요.
    # 반드시 외부 Secret Manager를 사용하세요:
    # - HashiCorp Vault
    # - AWS Secrets Manager
    # - Azure Key Vault
    # - GCP Secret Manager
    # - Sealed Secrets (Bitnami)
    config.kubernetes.io/local-config: "true"
type: Opaque
stringData:
  # ============================================================
  # 주의: 아래 값들은 모두 플레이스홀더입니다.
  # 실제 배포 시 외부 Secret Manager에서 주입하거나
  # CI/CD 파이프라인에서 환경변수로 치환해야 합니다.
  # ============================================================

  # 데이터베이스 인증 정보
  # 외부 주입 예시: vault kv get -field=username secret/cotalk/db
  SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
  SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"

  # Redis 인증 정보
  SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # JWT 시크릿 키 (최소 32자 이상의 강력한 키 사용)
  # 생성 예시: openssl rand -base64 64
  JWT_SECRET: "${JWT_SECRET}"

  # MinIO/S3 인증 정보
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"

---
