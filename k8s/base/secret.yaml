apiVersion: v1
kind: Secret
metadata:
  name: cotalk-secret
  namespace: cotalk
  labels:
    app.kubernetes.io/name: cotalk
type: Opaque
stringData:
  # 실제 운영 환경에서는 외부 Secret Manager (Vault, AWS Secrets Manager 등) 사용 권장
  # 아래 값들은 예시이며, 실제 배포 시 반드시 변경해야 함
  SPRING_DATASOURCE_USERNAME: "cotalk"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  SPRING_DATA_REDIS_PASSWORD: ""
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_KEY"
  MINIO_ACCESS_KEY: "minio-access-key"
  MINIO_SECRET_KEY: "minio-secret-key"
