apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cotalk-network-policy
  namespace: cotalk
  labels:
    app.kubernetes.io/name: cotalk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cotalk
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress Controller에서 오는 트래픽 허용
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus에서 오는 스크래핑 트래픽 허용
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # 같은 네임스페이스 내 Pod 간 통신 허용
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS 조회 허용
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # PostgreSQL 접근
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis 접근
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # MinIO 접근
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # Zipkin 접근
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9411
