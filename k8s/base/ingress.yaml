apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cotalk-ingress
  namespace: cotalk
  labels:
    app.kubernetes.io/name: cotalk
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # WebSocket 지원
    nginx.ingress.kubernetes.io/websocket-services: "cotalk-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
spec:
  ingressClassName: nginx
  rules:
    - host: cotalk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cotalk-service
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: cotalk-service
                port:
                  number: 80
